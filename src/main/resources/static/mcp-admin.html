<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作空间 · 小智 MCP</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body data-page="workspace"><div id="workspace" hidden><aside class="sidebar"><a href="/mcp-admin.html" class="brand">◈ 小智 MCP</a><p class="eyebrow">个人工作空间</p><nav aria-label="主导航"><button data-tab="nodes" class="nav active">◉ 小智节点</button><button data-tab="connections" class="nav">⌘ 外部 MCP</button><button data-tab="tools" class="nav">▷ 工具测试</button><button data-tab="users" class="nav" id="usersNav" hidden>♙ 用户管理</button><button data-tab="settings" class="nav">⚙ 账号设置</button></nav><div class="sidebar-bottom"><strong id="currentUsername"></strong><span id="currentRole" class="muted small"></span><button id="logout" class="secondary">退出登录</button></div></aside><main class="workspace-main"><header class="workspace-header"><div><p class="eyebrow">MCP WORKSPACE</p><h1 id="pageTitle">小智节点</h1><p class="muted">管理属于你的连接与工具，让每个小智各司其职。</p></div><button id="reload" class="secondary">刷新数据 ↻</button></header><p id="globalStatus" class="status" role="status" aria-live="polite"></p><div class="stats"><div class="card"><span>我的小智节点</span><strong id="nodeCount">—</strong></div><div class="card"><span>已连接节点</span><strong id="onlineCount">—</strong></div><div class="card"><span>外部 MCP 连接</span><strong id="connectionCount">—</strong></div></div>
<section data-panel="nodes"><div class="section-heading"><div><h2>我的小智节点</h2><p class="muted">每个节点使用一个独立接入点，可绑定不同的工具来源。</p></div><button id="newNode">＋ 新建节点</button></div><div id="nodeList" class="node-grid"></div><section id="nodeEditor" class="card" hidden><h2 id="nodeEditorTitle">新建节点</h2><form id="nodeForm"><input name="id" type="hidden"><div class="grid"><label>节点名称<input name="name" maxlength="128" required placeholder="例如：客厅小智"></label><label>小智 MCP 接入点<input name="endpoint" type="password" autocomplete="off" required placeholder="wss://…/mcp/?token=…"><span class="small muted">接入点包含凭证，仅在编辑时显示。每个接入点只能绑定一个节点。</span></label></div><div class="row checks"><label><input name="enabled" type="checkbox" checked> 启用并自动连接</label><label><input name="localTools" type="checkbox" checked> 启用本地工具</label></div><fieldset><legend>绑定我的外部 MCP（最多 20 个）</legend><div id="nodeBindings" class="binding-list"></div></fieldset><div class="row"><button type="submit">保存节点</button><button type="button" class="secondary" id="cancelNode">取消</button></div><p class="status" id="nodeStatus" role="status"></p></form></section></section>
<section data-panel="connections" hidden><div class="section-heading"><div><h2>我的外部 MCP</h2><p class="muted">支持 SSE 与 Streamable HTTP；连接保存后可在小智节点中绑定。</p></div><div class="row"><button class="secondary" id="refreshRuntime">刷新工具缓存</button><button id="newConnection">＋ 新建连接</button></div></div><div id="connectionList" class="card table-wrap"></div><section id="connectionEditor" class="card" hidden><h2 id="connectionEditorTitle">新建连接</h2><form id="connectionForm"><input type="hidden" name="id"><div class="grid"><label>连接名称<input name="connectionName" maxlength="128" required></label><label>传输协议<select name="transport"><option>SSE</option><option>STREAMABLE</option></select></label><label>服务 URL<input name="url" type="url" required placeholder="https://example.com/mcp"></label><label>自定义端点（可选）<input name="endpoint" maxlength="255" placeholder="留空则从 URL 推导"></label></div><label>请求头 JSON<textarea name="headers" spellcheck="false" placeholder='{"Authorization":"Bearer …"}'>{}</textarea></label><label class="checks"><input name="enabled" type="checkbox" checked> 启用连接</label><div class="row"><button type="submit">保存连接</button><button type="button" id="testConnection" class="secondary">测试连通性</button><button type="button" id="cancelConnection" class="secondary">取消</button></div><p class="status" id="connectionStatus" role="status"></p></form></section></section>
<section data-panel="tools" hidden><section class="card"><h2>工具调用测试</h2><p class="muted">选择自己的工具来源。工具调用会真实执行，请核对参数。</p><div class="row"><label class="grow">工具来源<select id="toolSource"></select></label><button id="loadTools">加载工具</button></div><p id="toolStatus" class="status" role="status"></p><label>工具<select id="toolName"><option value="">请先加载工具</option></select></label><p id="toolDescription" class="muted"></p><form id="invokeForm"><div id="toolArgs" class="grid"></div><button type="submit" id="invokeTool" disabled>执行工具</button></form><label>调用结果<textarea id="invokeResult" readonly rows="12" spellcheck="false"></textarea></label></section></section>
<section data-panel="users" hidden><div class="section-heading"><div><h2>用户管理</h2><p class="muted">创建账号、调整角色、停用账号及重置密码。</p></div><button id="newUser">＋ 创建用户</button></div><div id="userList" class="card table-wrap"></div><div class="row"><button id="prevUsers" class="secondary">上一页</button><span id="userPage"></span><button id="nextUsers" class="secondary">下一页</button></div><section id="userEditor" class="card" hidden><h2 id="userEditorTitle">创建用户</h2><form id="userForm"><input name="id" type="hidden"><div class="grid"><label>用户名<input name="username" pattern="[a-zA-Z0-9_.-]{3,64}" maxlength="64" required></label><label>角色<select name="role"><option value="USER">普通用户</option><option value="ADMIN">管理员</option></select></label><label>密码<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="72"><span class="muted small">至少 12 位。编辑时留空表示保留原密码。</span></label><label class="checks"><input name="enabled" type="checkbox" checked> 启用账号</label></div><div class="row"><button type="submit">保存用户</button><button type="button" id="cancelUser" class="secondary">取消</button></div><p id="userStatus" class="status" role="status"></p></form></section></section>
<section data-panel="settings" hidden><section class="card"><h2>修改密码</h2><form id="passwordForm"><div class="grid"><label>当前密码<input name="oldPassword" type="password" autocomplete="current-password" required maxlength="72"></label><label>新密码<input name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required></label></div><button type="submit">更新密码并重新登录</button><p id="passwordStatus" class="status" role="status"></p></form></section></section>
</main></div></body></html>
