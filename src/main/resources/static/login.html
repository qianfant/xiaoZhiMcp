<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 小智 MCP</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body data-page="login"><main class="login-layout"><section class="login-intro"><div class="brand">◈ 小智 MCP</div><p class="eyebrow">你的工具，随时连接</p><h1>一个账号，<br>连接多个小智。</h1><p>在自己的工作空间管理 MCP 工具与小智节点。每个人的连接、节点和个人记录独立保存。</p><div class="intro-chips"><span>多节点接入</span><span>独立工作空间</span><span>统一工具管理</span></div></section><section class="card login-card"><h2 id="loginTitle">登录工作空间</h2><p class="muted" id="loginHint">使用管理员分配的账号登录。</p><form id="loginForm"><label>用户名<input name="username" autocomplete="username" pattern="[a-zA-Z0-9_.-]{3,64}" minlength="3" maxlength="64" required autofocus></label><label>密码<input name="password" type="password" autocomplete="current-password" maxlength="72" required></label><button type="submit" id="loginSubmit">登录</button></form><button id="toggleRegister" class="secondary" hidden>创建账号</button><p class="status" id="loginStatus" role="status" aria-live="polite"></p><p class="muted small">首次部署：管理员账号由服务器环境变量初始化。</p></section></main></body></html>
