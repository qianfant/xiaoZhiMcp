server:
  port: 0
spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  mail:
    host: localhost
  ai:
    mcp:
      server:
        enabled: true
        name: xiaozhi-test
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
langchain4j:
  open-ai:
    embedding-model:
      api-key: test-not-used
      model-name: test
qdrant:
  host: localhost
  port: 6334
  collection-name: test
xiaozhi:
  security:
    admin-username: admin
    admin-password: test-admin-password
    registration-enabled: true
  external-mcp:
    connect-timeout: 1s
    request-timeout: 2s
    initialization-timeout: 2s
    database:
      enabled: true
      url: jdbc:h2:mem:${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
      username: sa
      password: ""
